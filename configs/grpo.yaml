model:
  name: Qwen/Qwen2.5-1.5B

lora:
  r: 16
  alpha: 32
  dropout: 0.05

grpo:
  num_generations: 8
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.95

training:
  learning_rate: 5e-7
  batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  kl_coef: 0.1
  clip_range: 0.2
  max_grad_norm: 1.0
  use_wandb: false

reward:
  classifier_path: outputs/classifier/best
  temperature: 1.0
  style_weight: 0.65
  length_bonus_weight: 0.1
  prompt_relevance_weight: 0.2
  repetition_penalty_weight: 0.15
  prompt_echo_penalty_weight: 0.1
  reference_copy_penalty_weight: 0.15
  # tokens, same unit as max_new_tokens above. Set from scripts/measure_length_units.py:
  # the corpus positives sit at a median of 51 tokens (es 49, en 54) and a p90 of 85,
  # so the bonus peaks near the median and reaches zero at 120, inside the 256 budget.
  target_length: 60
  reference_texts_path: data/processed/train
  reference_ngram_size: 8
  # prompt_relevance and prompt_echo_penalty grade disjoint halves of seed reuse (issue #16).
  # shortest run of content tokens the completion has to copy verbatim before the echo
  # penalty charges for it, clamped down when the seed itself is shorter. relevance excludes
  # copied runs from length 2, so a copy trimmed to just under this window is not paid either
  echo_ngram_size: 4
  # share of the seed's content tokens a completion may hand back verbatim for free
  echo_floor: 0.35
  # content tokens the completion has to carry outside any copied run to earn the full
  # relevance component, fixed so the scale does not follow seed length
  relevance_target_tokens: 8

prompts:
  path: data/processed/prompts
  # prompts are extracted from Marcelo's writing:
  # control tokens for style/language are added automatically when prompts are extracted

output:
  dir: outputs/grpo

model:
  name: Qwen/Qwen2.5-1.5B

lora:
  r: 16
  alpha: 32
  dropout: 0.05

training:
  learning_rate: 1e-4
  batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_length: 512
  use_wandb: false

data:
  train_path: data/processed/train
  val_path: data/processed/val
  # SFT trains on positives only; negatives exist for the classifier

output:
  dir: outputs/sft
